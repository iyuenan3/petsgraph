name: Verify Windows release ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag whose public Windows ZIP should be verified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: petsgraph-windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-windows-zip:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a semantic version tag such as v0.6.0"
          }

      - name: Check out the release contract
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and release manifest
        shell: pwsh
        run: |
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          git merge-base --is-ancestor $tagCommit HEAD
          if ($LASTEXITCODE -ne 0) { throw "Tag is not an ancestor of the release contract" }

          $manifestPath = "release/manifests/$env:RELEASE_TAG.json"
          if (-not (Test-Path $manifestPath)) { throw "Release manifest missing: $manifestPath" }
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $artifacts = @($manifest.artifacts)
          $embeddedPets = @($manifest.embeddedPets)
          $platforms = @($manifest.platforms | Where-Object { $_.id -eq "windows-11-x64" })
          $zipArtifacts = @($artifacts | Where-Object { $_.platform -eq "windows-11-x64" -and $_.kind -eq "portable-zip" })

          if ($manifest.tag -ne $env:RELEASE_TAG) { throw "Manifest tag mismatch" }
          if ($manifest.schema -ne 2) { throw "Expected dual-platform manifest schema 2" }
          if ($manifest.sourceTagCommit -ne $tagCommit) { throw "Source tag commit mismatch" }
          if ($platforms.Count -ne 1) { throw "Expected one windows-11-x64 platform" }
          if ($platforms[0].runtime -ne "net10.0-windows") { throw "Expected net10.0-windows runtime" }
          if ($platforms[0].distribution -ne "portable-zip") { throw "Expected portable-zip distribution" }
          if ($platforms[0].signed -ne $false) { throw "Expected unsigned Windows release" }
          if ($manifest.runtimeChainStatus -ne "runtime-chain-approved") { throw "Runtime chain is not approved" }
          if ($manifest.installable -ne $true) { throw "Release is not installable" }
          if ($embeddedPets.Count -ne 2) { throw "Expected exactly two embedded pets" }
          if ($zipArtifacts.Count -ne 1) {
            throw "Expected exactly one portable ZIP artifact"
          }
      - name: Download exact ZIP from public release
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "release/manifests/$env:RELEASE_TAG.json" | ConvertFrom-Json
          $asset = @($manifest.artifacts | Where-Object { $_.platform -eq "windows-11-x64" -and $_.kind -eq "portable-zip" })[0].file
          $isDraft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne "false") { throw "Release must be public" }

          $declaredAssets = @($manifest.artifacts.file | Sort-Object)
          $actualAssets = @(gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json assets `
            --jq '.assets[].name' | Sort-Object)
          if ($LASTEXITCODE -ne 0) { throw "Failed to read public release assets" }
          if (@(Compare-Object $declaredAssets $actualAssets).Count -ne 0) {
            throw "Public release asset set does not match the manifest"
          }

          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/release-download" | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $asset `
            --dir "$env:RUNNER_TEMP/release-download"
          if ($LASTEXITCODE -ne 0) { throw "Failed to download $asset" }

      - name: Verify ZIP, digest, x64 PE, packages, and runtime integrity
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "release/manifests/$env:RELEASE_TAG.json" | ConvertFrom-Json
          $artifact = @($manifest.artifacts | Where-Object { $_.platform -eq "windows-11-x64" -and $_.kind -eq "portable-zip" })[0]
          $zip = Join-Path "$env:RUNNER_TEMP/release-download" $artifact.file
          $actualBytes = (Get-Item $zip).Length
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualBytes -ne [int64]$artifact.bytes) { throw "ZIP byte count mismatch" }
          if ($actualHash -ne $artifact.sha256) { throw "ZIP SHA-256 mismatch" }

          $extract = Join-Path $env:RUNNER_TEMP "petsgraph-release-verify"
          Expand-Archive -Path $zip -DestinationPath $extract
          $root = Join-Path $extract "PetsGraph"
          $exe = Join-Path $root "PetsGraph.exe"
          $versionFile = Join-Path $root "VERSION.txt"
          if (-not (Test-Path $exe)) { throw "PetsGraph.exe missing" }
          if (-not (Test-Path $versionFile)) { throw "VERSION.txt missing" }
          if ((Get-Content -Raw $versionFile).Trim() -ne $manifest.version) { throw "Version file mismatch" }

          $packages = @(Get-ChildItem -Path (Join-Path $root "Pets") -Directory -Filter "*.petsgraph-pet")
          if ($packages.Count -ne @($manifest.embeddedPets).Count) {
            throw "Embedded package count does not match manifest"
          }

          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature" }
            if ($reader.ReadUInt16() -ne 0x8664) { throw "Expected AMD64 PE machine" }
          }
          finally {
            $stream.Dispose()
          }

          $process = Start-Process $exe `
            -ArgumentList "--validate-only", "--verify-integrity", "--pets-dir", ('"' + (Join-Path $root "Pets") + '"') `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "PetsGraph runtime validation failed with exit code $($process.ExitCode)"
          }

          "Windows ZIP SHA-256: $actualHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Windows ZIP bytes: $actualBytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Embedded pets: $($packages.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
