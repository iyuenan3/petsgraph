name: macOS Apple Silicon build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "player/macos/**"
      - "petpack/**"
      - "assets/brand/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "player/macos/**"
      - "petpack/**"
      - "assets/brand/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

concurrency:
  group: petsgraph-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Test PetPack and macOS runtime
        shell: bash
        run: |
          python3 -m unittest discover -s petpack/tests -v
          bash player/macos/scripts/test.sh

      - name: Build zero-pet Apple Silicon app
        shell: bash
        run: |
          python3 player/macos/scripts/build-app.py \
            --output .local/dist/PetsGraph-1.0.0.app \
            --version 1.0.0 \
            --build-number 19
          test "$(lipo -archs .local/dist/PetsGraph-1.0.0.app/Contents/MacOS/petsgraph)" = "arm64"
          test ! -d .local/dist/PetsGraph-1.0.0.app/Contents/Resources/Pets
          test -z "$(find .local/dist/PetsGraph-1.0.0.app -name '*.petpack' -print -quit)"
          info_path=.local/dist/PetsGraph-1.0.0.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_path")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_path")" = "19"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$info_path")" = "com.maxwell.petsgraph.petpack"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$info_path")" = "petpack"
          codesign --verify --deep --strict --verbose=2 .local/dist/PetsGraph-1.0.0.app

      - name: Upload code-only app
        uses: actions/upload-artifact@v7
        with:
          name: PetsGraph-1.0.0-macOS-arm64
          path: .local/dist/PetsGraph-1.0.0.app
          if-no-files-found: error
          retention-days: 7
