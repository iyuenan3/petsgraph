name: Verify macOS release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag whose public macOS DMG should be verified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: petsgraph-macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-macos-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.6.0"
            exit 1
          fi

      - name: Check out the release contract
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out immutable release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source

      - name: Verify immutable tag and dual-platform manifest
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" HEAD
          test -f "release/manifests/$RELEASE_TAG.json"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$tag_commit" '
            .schema == 2
            and .tag == $tag
            and .sourceTagCommit == $commit
            and ([.platforms[].id] | sort) == ["macos-arm64", "windows-11-x64"]
            and (.platforms | any(.id == "macos-arm64" and .architecture == "arm64" and .minimumSystemVersion == "14.0" and .distribution == "installer-dmg" and .signing == "ad-hoc" and .notarized == false))
            and (.platforms | any(.id == "windows-11-x64" and .architecture == "x64" and .runtime == "net10.0-windows" and .distribution == "portable-zip" and .signed == false))
            and .packageSchemaVersions == ["0.4.0"]
            and .renderModes == ["cropped-rgba-clips"]
            and .runtimeChainStatus == "runtime-chain-approved"
            and .installable == true
            and (.embeddedPets | length == 2)
            and (([.embeddedPets[].id] | unique | length) == (.embeddedPets | length))
            and (([.artifacts[].kind] | sort) == ["installer-dmg", "portable-zip"])
            and (([.artifacts[].platform] | sort) == ["macos-arm64", "windows-11-x64"])
            and all(.artifacts[]; (.file | endswith(".petsgraph-pet.zip") | not))
          ' "release/manifests/$RELEASE_TAG.json" >/dev/null
      - name: Run the full Swift test baseline
        working-directory: release-source
        run: bash tools/test-swift.sh

      - name: Confirm the release is public
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$is_draft" = "false"
          jq -r '.artifacts[].file' "release/manifests/$RELEASE_TAG.json" | sort > declared-assets.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > actual-assets.txt
          diff -u declared-assets.txt actual-assets.txt

      - name: Download every declared release artifact
        shell: bash
        run: |
          mkdir -p release-download
          while IFS= read -r filename; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir release-download
          done < <(jq -r '.artifacts[].file' "release/manifests/$RELEASE_TAG.json")

      - name: Verify sizes and SHA-256 digests
        shell: bash
        run: |
          while IFS=$'\t' read -r filename expected_bytes expected_sha; do
            artifact="release-download/$filename"
            test -f "$artifact"
            actual_bytes="$(stat -f %z "$artifact")"
            actual_sha="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            test "$actual_bytes" = "$expected_bytes"
            test "$actual_sha" = "$expected_sha"
          done < <(
            jq -r '.artifacts[] | [.file, (.bytes | tostring), .sha256] | @tsv' \
              "release/manifests/$RELEASE_TAG.json"
          )

      - name: Verify the public DMG and Apple Silicon app
        shell: bash
        run: |
          manifest="release/manifests/$RELEASE_TAG.json"
          dmg="$(jq -er '
            [.artifacts[] | select(.platform == "macos-arm64" and .kind == "installer-dmg")]
            | if length == 1 then .[0].file else error("expected exactly one DMG") end
          ' "$manifest")"
          hdiutil verify "release-download/$dmg"
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -rf "$mount_point"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "release-download/$dmg" >/dev/null
          app_count="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          test "$app_count" = "1"
          app_path="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          binary_path="$app_path/Contents/MacOS/PetsGraph"
          info_path="$app_path/Contents/Info.plist"
          pets_path="$app_path/Contents/Resources/Pets"
          icon_path="$app_path/Contents/Resources/PetsGraph.icns"
          test "$(lipo -archs "$binary_path")" = "arm64"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$info_path")" = "PetsGraph"
          test "$(plutil -extract CFBundleName raw -o - "$info_path")" = "PetsGraph"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info_path")" = "com.maxwell.petsgraph"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info_path")" = "${RELEASE_TAG#v}"
          test "$(plutil -extract CFBundleIconFile raw -o - "$info_path")" = "PetsGraph"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$info_path")" = "14.0"
          test "$(shasum -a 256 "$icon_path" | awk '{print $1}')" = "$(jq -r '.branding.macosIcnsSha256' "$manifest")"
          package_paths=()
          while IFS= read -r package_path; do
            package_paths+=("$package_path")
          done < <(find "$pets_path" -maxdepth 1 -type d -name '*.petsgraph-pet' | sort)
          test "${#package_paths[@]}" = "$(jq '.embeddedPets | length' "$manifest")"
          for package_path in "${package_paths[@]}"; do
            review_path="$(jq -er '.reviewIndex' "$package_path/package.json")"
            pet_id="$(jq -er '.pet.id' "$package_path/package.json")"
            package_id="$(jq -er '.package.id' "$package_path/package.json")"
            package_version="$(jq -er '.package.version' "$package_path/package.json")"
            jq -e \
              --arg pet_id "$pet_id" \
              --arg package_id "$package_id" \
              --arg package_version "$package_version" '
                any(.embeddedPets[];
                  .id == $pet_id
                  and .packageId == $package_id
                  and .packageVersion == $package_version
                  and .schemaVersion == "0.4.0"
                  and .renderMode == "cropped-rgba-clips"
                )
              ' "$manifest" >/dev/null
            jq -e '
              .schemaVersion == "0.4.0"
              and .renderAssets.mode == "cropped-rgba-clips"
              and (.pet.displayName | length > 0)
            ' "$package_path/package.json" >/dev/null
            jq -e '
              .runtimeChainStatus == "runtime-chain-approved"
              and .installable == true
              and (.remainingRuntimeGates | length) == 0
            ' "$package_path/$review_path" >/dev/null
          done
          codesign --verify --deep --strict --verbose=2 "$app_path"
          "$binary_path" "${package_paths[@]}" --validate-only

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Verified $RELEASE_TAG macOS DMG"
            echo
            echo "Both declared artifacts matched their pinned byte counts and SHA-256 digests."
            echo
            echo "The public release was verified without write permission."
          } >> "$GITHUB_STEP_SUMMARY"
