name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag whose draft release should be verified and published
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: petsgraph-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.3.0"
            exit 1
          fi

      - name: Check out the tagged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag and release manifest
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          test -f "release/manifests/$RELEASE_TAG.json"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag == $tag
            and .platform == "macos-arm64"
            and .packageSchemaVersions == ["0.4.0"]
            and .renderModes == ["cropped-rgba-clips"]
            and .runtimeChainStatus == "runtime-chain-approved"
            and .installable == true
            and (.embeddedPets | length >= 1)
            and (([.embeddedPets[].id] | unique | length) == (.embeddedPets | length))
            and (([.artifacts[].kind] | sort) == ["installer-dmg"])
            and all(.artifacts[]; (.file | endswith(".petsgraph-pet.zip") | not))
          ' \
            "release/manifests/$RELEASE_TAG.json" >/dev/null

      - name: Run the full Swift test baseline
        run: bash tools/test-swift.sh

      - name: Confirm the release is still a draft
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$is_draft" = "true"
          jq -r '.artifacts[].file' "release/manifests/$RELEASE_TAG.json" | sort > declared-assets.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > actual-assets.txt
          diff -u declared-assets.txt actual-assets.txt

      - name: Download every declared release artifact
        shell: bash
        run: |
          mkdir -p release-download
          while IFS= read -r filename; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" \
              --dir release-download
          done < <(jq -r '.artifacts[].file' "release/manifests/$RELEASE_TAG.json")

      - name: Verify sizes and SHA-256 digests
        shell: bash
        run: |
          while IFS=$'\t' read -r filename expected_bytes expected_sha; do
            artifact="release-download/$filename"
            test -f "$artifact"
            actual_bytes="$(stat -f %z "$artifact")"
            actual_sha="$(shasum -a 256 "$artifact" | awk '{print $1}')"
            test "$actual_bytes" = "$expected_bytes"
            test "$actual_sha" = "$expected_sha"
          done < <(
            jq -r '.artifacts[] | [.file, (.bytes | tostring), .sha256] | @tsv' \
              "release/manifests/$RELEASE_TAG.json"
          )

      - name: Verify the public DMG and Apple Silicon app
        shell: bash
        run: |
          dmg="$(jq -er '
            [.artifacts[] | select(.kind == "installer-dmg")]
            | if length == 1 then .[0].file else error("expected exactly one DMG") end
          ' \
            "release/manifests/$RELEASE_TAG.json")"
          hdiutil verify "release-download/$dmg"
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -rf "$mount_point"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "release-download/$dmg" >/dev/null
          app_count="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          test "$app_count" = "1"
          app_path="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          binary_path="$app_path/Contents/MacOS/petsgraph"
          info_path="$app_path/Contents/Info.plist"
          pets_path="$app_path/Contents/Resources/Pets"
          test "$(lipo -archs "$binary_path")" = "arm64"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$info_path")" = "PetsGraph"
          test "$(plutil -extract CFBundleName raw -o - "$info_path")" = "PetsGraph"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info_path")" = "com.maxwell.petsgraph"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info_path")" = "${RELEASE_TAG#v}"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$info_path")" = "14.0"
          package_paths=()
          while IFS= read -r package_path; do
            package_paths+=("$package_path")
          done < <(find "$pets_path" -maxdepth 1 -type d -name '*.petsgraph-pet' | sort)
          test "${#package_paths[@]}" = "$(jq '.embeddedPets | length' "release/manifests/$RELEASE_TAG.json")"
          for package_path in "${package_paths[@]}"; do
            review_path="$(jq -er '.reviewIndex' "$package_path/package.json")"
            jq -e --arg version "${RELEASE_TAG#v}" '
              .schemaVersion == "0.4.0"
              and .package.version == $version
              and .renderAssets.mode == "cropped-rgba-clips"
              and (.pet.displayName | length > 0)
            ' "$package_path/package.json" >/dev/null
            jq -e '
              .runtimeChainStatus == "runtime-chain-approved"
              and .installable == true
              and (.remainingRuntimeGates | length) == 0
            ' "$package_path/$review_path" >/dev/null
          done
          codesign --verify --deep --strict --verbose=2 "$app_path"
          "$binary_path" "${package_paths[@]}" --validate-only

      - name: Publish the verified release
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "All declared artifacts matched their pinned byte counts and SHA-256 digests."
            echo
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url'
          } >> "$GITHUB_STEP_SUMMARY"
