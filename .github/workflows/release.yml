name: Verify macOS release DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version tag whose public macOS DMG should be verified
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: petsgraph-macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-macos-dmg:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0"
            exit 1
          fi

      - name: Check out the release contract
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check out immutable release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: release-source

      - name: Verify immutable tag and zero-pet manifest
        shell: bash
        run: |
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$tag_commit" HEAD
          manifest="release/manifests/$RELEASE_TAG.json"
          test -f "$manifest"
          jq -e --arg tag "$RELEASE_TAG" --arg version "${RELEASE_TAG#v}" --arg commit "$tag_commit" '
            .schema == 3
            and .tag == $tag
            and .version == $version
            and .sourceTagCommit == $commit
            and .player.zeroPet == true
            and .player.embeddedPetCount == 0
            and .player.petpackFormatVersions == ["1.0.0"]
            and ([.platforms[].id] | sort) == ["macos-arm64", "windows-x64"]
            and (.platforms | any(.id == "macos-arm64" and .architecture == "arm64" and .minimumSystemVersion == "14.0" and .distribution == "installer-dmg" and .signing == "ad-hoc" and .notarized == false))
            and (.platforms | any(.id == "windows-x64" and .architecture == "x64" and .minimumSystemVersion == "Windows 11" and .runtime == "net10.0-windows" and .distribution == "portable-zip" and .signed == false))
            and (([.artifacts[].kind] | sort) == ["installer-dmg", "portable-zip"])
            and (([.artifacts[].platform] | sort) == ["macos-arm64", "windows-x64"])
          ' "$manifest" >/dev/null

      - name: Run PetPack and Swift release tests
        working-directory: release-source
        shell: bash
        run: |
          python3 -m unittest discover -s petpack/tests -v
          bash player/macos/scripts/test.sh

      - name: Confirm public release and exact asset set
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "false"
          jq -r '.artifacts[].file' "release/manifests/$RELEASE_TAG.json" | sort > declared-assets.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u declared-assets.txt actual-assets.txt

      - name: Download and verify every artifact
        shell: bash
        run: |
          mkdir release-download
          while IFS=$'\t' read -r filename expected_bytes expected_sha; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$filename" --dir release-download
            artifact="release-download/$filename"
            test "$(stat -f %z "$artifact")" = "$expected_bytes"
            test "$(shasum -a 256 "$artifact" | awk '{print $1}')" = "$expected_sha"
          done < <(jq -r '.artifacts[] | [.file, (.bytes | tostring), .sha256] | @tsv' "release/manifests/$RELEASE_TAG.json")

      - name: Verify zero-pet Apple Silicon app
        shell: bash
        run: |
          manifest="release/manifests/$RELEASE_TAG.json"
          dmg="$(jq -er '[.artifacts[] | select(.platform == "macos-arm64" and .kind == "installer-dmg")] | if length == 1 then .[0].file else error("expected one DMG") end' "$manifest")"
          hdiutil verify "release-download/$dmg"
          mount_point="$(mktemp -d)"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -rf "$mount_point"' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "release-download/$dmg" >/dev/null
          app_path="$mount_point/PetsGraph.app"
          binary_path="$app_path/Contents/MacOS/petsgraph"
          info_path="$app_path/Contents/Info.plist"
          test -x "$binary_path"
          test "$(lipo -archs "$binary_path")" = "arm64"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info_path")" = "com.maxwell.petsgraph"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info_path")" = "${RELEASE_TAG#v}"
          test "$(plutil -extract CFBundleVersion raw -o - "$info_path")" = "$(jq -r '.platforms[] | select(.id == "macos-arm64") | .buildNumber' "$manifest")"
          test "$(plutil -extract LSMinimumSystemVersion raw -o - "$info_path")" = "14.0"
          test "$(plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw -o - "$info_path")" = "com.maxwell.petsgraph.petpack"
          test "$(shasum -a 256 "$app_path/Contents/Resources/PetsGraph.icns" | awk '{print $1}')" = "$(jq -r '.branding.macosIcnsSha256' "$manifest")"
          test ! -d "$app_path/Contents/Resources/Pets"
          test -z "$(find "$app_path" -name '*.petpack' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          "$binary_path" --validate-only "release-source/petpack/fixtures/synthetic-cat-v1.petpack"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Verified $RELEASE_TAG macOS DMG"
            echo
            echo "Both public artifacts matched the pinned sizes and SHA-256 digests."
            echo "The mounted arm64 app was signed, versioned, zero-pet, and able to validate PetPack 1.0."
          } >> "$GITHUB_STEP_SUMMARY"
